<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Munich District Timeline - Interactive Map</title>
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-content">
        <div class="header-title">
          <h1>Munich District Timeline</h1>
          <p>Explore demographic data across Munich's districts</p>
        </div>
        <div class="header-controls">
          <div class="slider-container">
            <label for="year-slider">Year: <span id="year-display">2019</span></label>
            <input type="range" id="year-slider" min="2000" max="2019" value="2019" step="1">
          </div>
        </div>
      </div>
    </header>
    
    <main>
      <div class="map-container">
        <div id="map"></div>
        <div id="legend"></div>
      </div>
      
      <aside id="side-panel" class="side-panel hidden">
        <button id="close-panel" class="close-btn" aria-label="Close panel">&times;</button>
        <div class="district-content">
          <img id="district-image" src="" alt="District" class="district-image">
          <h2 id="district-name">Select a district</h2>
          <div id="district-info"></div>
          <div id="district-chart"></div>
        </div>
      </aside>
    </main>
  </div>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
