<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Timeline Munich</title>
  
  <!-- Materialize CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.97.3/css/materialize.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
  
  <style>
    /* Native range slider styling */
    #slider {
      width: 100%;
      margin: 20px 0;
    }
    
    #sliderValue {
      display: block;
      text-align: center;
      font-size: 1.2em;
      margin: 10px 0;
      font-weight: bold;
    }
    
    .slider-container {
      padding: 20px;
    }
  </style>
</head>
<body>
  <!-- Container left "nav" -->
  <ul id="nav-mobile" class="side-nav fixed detailbar left">
    <li>
      <img class="districtImage" src="/img/districts/lehel.png" alt="District"/>
      <div class="districtDetails">
        <h5 id="districtName">Bezirkname</h5>
        <p>Details...</p>
        <div id="test"></div>
      </div>
    </li>
  </ul>
  
  <!-- Container right "nav" -->
  <ul class="side-nav fixed detailbar right">
    <div class="row">
      <div class="col m4">
        <ul id="timeline"></ul>
      </div>
      <div class="col m4 slider-container">
        <span id="sliderValue">2015</span>
        <input type="range" step="1" min="2001" max="2015" id="slider" name="timeline_slider" value="2015" />
      </div>
    </div>
  </ul>
  
  <div class="myContainer">
    <div class="row">
      <div class="col m10 center">
        <div class="mapContainer" id="map"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
